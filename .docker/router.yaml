http:
  services:
    ollama:
      loadBalancer:
        healthCheck:
          interval: 5s
          path: /
        servers:
          - url: http://ollama-1:11434
          - url: http://ollama-2:11435
          - url: http://host.docker.internal:11434

  routers:
    ollama-router:
      rule: "PathPrefix(`/`)"
      service: ollama