version: "3.9"
services:
  private-gpt:
    image: incri07/private-gpt:latest
    build:
      context: .
      dockerfile: Dockerfile.new
    env_file:
      - .env
    volumes:
      - ./local_data/:/app/local_data
      - ./models/:/app/models
      - ./media/:/app/private_gpt/media
      - ./root/.cache:/root/.cache
      - ./private_gpt/:/app/private_gpt
      - ./alembic/:/app/alembic
      - ./settings.yaml:/app/settings.yaml
      - ./settings-gemini.yaml:/app/settings-gemini.yaml

    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
      # qdrant:
      #   condition: service_healthy
    environment:
      PORT: 8000
      PGPT_PROFILES: gemini
      PGPT_MODE: gemini

      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      QDRANT_URL: http://qdrant:6333
      TIKTOKEN_CACHE_DIR: /app/models/tiktoken
      # OLLAMA_URL: http://ollama:11434
    restart: unless-stopped
    # healthcheck:
    # test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
    # interval: 30s
    # timeout: 10s
    # retries: 3
    # start_period: 20s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # command: >
    #   sh -c "PYTHONUNBUFFERED=1 PGPT_PROFILES=ollama poetry run python -m uvicorn private_gpt.main:app --host 0.0.0.0 --port 8000 --workers 2"

  db:
    image: postgres:16-alpine
    container_name: db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5434"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7.0.5
    container_name: redis
    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "localhost", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

#   ollama:
#     image: ollama/ollama:latest
#     ports:
#       - "11434:11434"
#     volumes:
#       - ./models:/root/.ollama
#     restart: unless-stopped
#     healthcheck:
#       test: ["CMD", "curl", "-f", "http://ollama:11434"]
#       interval: 10s
#       timeout: 5s
#       retries: 3
#       start_period: 60s

#     deploy:
#       resources:
#         reservations:
#           devices:
#             - driver: nvidia
#               count: 1
#               capabilities: [gpu]

volumes:
  postgres-data:
    name: pgpt-postgres-data
  qdrant-data:
    name: pgpt-qdrant-data
  private-gpt-data:
    name: pgpt-private-gpt-data
  redis-data:
    name: pgpt-redis-data

configs:
  qdrant_config:
    content: |
      log_level: INFO
      storage:
        # Performance optimizations
        performance:
          max_search_threads: 4
          max_optimization_threads: 2
        # Enable on-disk payload storage for memory efficiency
        on_disk_payload: true
      # HNSW index optimization
      hnsw_index:
        m: 16                      # Connections per layer (default: 16, higher = better recall but slower)
        ef_construct: 200          # Build-time accuracy (default: 100, higher = better index quality)
        full_scan_threshold: 10000 # Use HNSW for collections > 10k vectors
        on_disk: false             # Keep index in RAM for speed
      # Quantization for memory efficiency
      quantization:
        scalar:
          type: int8
          quantile: 0.99
          always_ram: true         # Keep quantized vectors in RAM
